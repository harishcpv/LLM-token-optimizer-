[build-system]
requires = ["setuptools==68.2.2", "wheel==0.41.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-token-optimizer"
version = "0.1.0"
description = "Core data, parsing, token accounting, simulation, and optimization rules for agent prompts"
requires-python = ">=3.11.2,<3.12"
dependencies = []

[project.scripts]
agent-token-audit = "audit_cli:main"

[project.optional-dependencies]
app = ["streamlit==1.57.0"]
test = ["pytest==8.4.2", "streamlit==1.57.0"]
tokenizer = ["tiktoken==0.14.0"]

[tool.setuptools]
py-modules = ["audit_cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
