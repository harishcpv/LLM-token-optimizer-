name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-build.lock --requirement requirements.lock

      - name: Install the local package
        run: python -m pip install --no-build-isolation --no-deps --editable .

      - name: Run tests
        run: make test

      - name: Run the checked-in demo fixture
        run: >-
          agent-token-audit
          --code-file examples/agent.py
          --prompt-file examples/prompt.json
          --tools-file examples/tools.json
          > demo-report.json

      - name: Validate demo report
        run: >-
          python -c
          "import json; report=json.load(open('demo-report.json', encoding='utf-8')); assert report['findings']; print('demo findings:', len(report['findings']))"
